<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный блог</title>
    <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
    crossorigin="anonymous">
</head>
<body class="bg-dark text-light"> 
    <nav class="navbar navbar-expand-lg p-3">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <h5 class="">Личный блог</h5>
            <div>
                <a class="me-3 btn btn-light text-black rounded-pill text-decoration-none" href="{{ url_for('main') }}">Главная</a> 
                <a class="me-3 btn btn-light text-black rounded-pill text-decoration-none" href="{{ url_for('about_me') }}">Обо мне</a>
                {% if current_user.is_authenticated %}
                <a class="btn btn-light text-black rounded-pill text-decoration-none" href="{{ url_for('logout') }}">Выйти</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="p-4">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <ul>
            {% for message in messages %}
            <li>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
