{% extends "base.html" %}

{% block content %}  
    {% if current_user.is_authenticated %}
    <a class="btn btn-light text-black rounded-pill text-decoration-none" href="{{ url_for('create_post') }}">Создать новый пост</a>
    {% endif %}

    {% for post in posts %}
        <div class="post bg-light text-black rounded p-4 mb-4 mt-3">
            {% include '_post.html' %}
            {% if current_user.is_authenticated and post.author == current_user %}
            <div class="mt-3">
                <a class="btn btn-primary btn-sm rounded-pill me-1" href="{{ url_for('edit_post', post_id=post.id) }}">Редактировать</a>
                <form class="d-inline" action="{{ url_for('delete_post', post_id=post.id) }}" method="post">
                    <button class="btn btn-danger btn-sm rounded-pill" type="submit" onclick="return confirm('Вы уверены, что хотите удалить пост?')">Удалить</button>
                </form>
            </div>
            {% endif %}
        </div>
    {% endfor %}
{% endblock %}
